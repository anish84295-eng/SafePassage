name: SafePassage CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
        working-directory: backend
      - run: python -m pytest -v
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check every JavaScript file
        shell: bash
        run: find frontend -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image without publishing
        run: docker build --tag safepassage:ci .
      - name: Smoke test container health endpoint
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker run --detach --publish 8000:8000 safepassage:ci)"
          cleanup() {
            docker stop "$container_id" >/dev/null 2>&1 || true
            docker rm "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          deadline=$((SECONDS + 60))
          until curl --fail --silent http://127.0.0.1:8000/api/health | grep -Fxq '{"status":"ok"}'; do
            if (( SECONDS >= deadline )); then
              echo "Container health endpoint did not become ready within 60 seconds."
              docker logs "$container_id"
              exit 1
            fi
            sleep 2
          done
